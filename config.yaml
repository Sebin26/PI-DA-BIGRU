# DA-BiGRU Wind Speed Forecasting System Configuration

# Global Settings
seed: 2026
device: cuda  # or 'cpu'

# Data Configuration
data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_test_split: 0.8
  
# Model Configuration
model:
  architecture: DA_BiGRU
  hidden_dim: 64
  n_layers: 2
  dropout: 0.2
  input_dim: 12  # Number of features

# Training Configuration
training:
  epochs: 50
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 1e-5
  patience: 10
  checkpoint_dir: models/checkpoints
  log_interval: 5

# Features
features:
  base_features:
    - WS50M
    - WS10M
    - WS100M
    - T2M
    - PS
  engineered_features:
    - WindShear
    - AirDensity
    - TurbulenceIntensity
    - Hour_Sin
    - Hour_Cos
    - Month_Sin
    - Month_Cos
  target: WS50M

# Sequence Configuration
sequence:
  seq_len: 24  # 24 hours of context

# Evaluation
evaluation:
  metrics:
    - mae
    - rmse
    - r2
    - mape
  wind_categories:
    - "Calm (0-2)"
    - "Light (2-5)"
    - "Moderate (5-8)"
    - "High (8+)"

# Paths
paths:
  project_root: .
  results_dir: results
  models_dir: models
  scripts_dir: scripts
